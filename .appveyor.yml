environment:
  matrix:
    - TOXENV: lint
      PYTHON_VERSION: 3.10
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2004
    - TOXENV: py39-windows
      PYTHON_VERSION: 3.9
      APPVEYOR_BUILD_WORKER_IMAGE: "Visual Studio 2019"
    - TOXENV: py311-macos
      PYTHON_VERSION: 3.11
      APPVEYOR_BUILD_WORKER_IMAGE: macOS
    - TOXENV: py38-linux
      PYTHON_VERSION: 3.8
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2004
    - TOXENV: py39-linux
      PYTHON_VERSION: 3.9
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2004
    - TOXENV: py310-linux
      PYTHON_VERSION: 3.10
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2004
    - TOXENV: py311-linux
      PYTHON_VERSION: 3.11
      APPVEYOR_BUILD_WORKER_IMAGE: Ubuntu2004

build: false

install:
  - sh: source ~/venv${PYTHON_VERSION}/bin/activate
  - cmd: set PATH=C:\Python39;C:\Python39\Scripts;%PATH%
  - python -m pip install -U tox

test_script:
  - python -m tox -vv

branches:
  only:
    - master
